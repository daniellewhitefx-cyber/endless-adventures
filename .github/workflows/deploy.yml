name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deploy from a clean git-archive export rather than the checked-out
      # working tree, so .git history (and anything gitignored) never gets
      # scanned or uploaded as a public asset -- .assetsignore alone isn't
      # reliable for excluding .git.
      - name: Build clean deploy directory
        run: |
          mkdir -p dist
          git archive HEAD | tar -x -C dist
          cp wrangler.jsonc _redirects .assetsignore dist/

      # Every HTML page links its CSS/JS with a ?v=__ASSET_VERSION__
      # placeholder. Stamping it with this commit's SHA on every deploy
      # guarantees a new URL (and so a guaranteed cache miss on Cloudflare's
      # edge) for assets each time they change, instead of a static version
      # string that only busts the cache once and then goes stale itself
      # across later deploys.
      - name: Stamp asset version
        run: |
          find dist -maxdepth 1 -iname "*.html" -print0 \
            | xargs -0 sed -i "s/__ASSET_VERSION__/${GITHUB_SHA::12}/g"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dist
          command: deploy
          wranglerVersion: "4"
